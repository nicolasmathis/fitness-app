<style>
  :root{
    --bg:#1c1a17;
    --surface:#26231f;
    --surface-2:#312c26;
    --border:#3a352e;
    --text:#ede7dc;
    --text-dim:#a89f91;
    --accent:#b8501f;
    --accent-dim:#7a3a1c;
    --gold:#c9a227;
    --sage:#6b8f7a;
    --danger:#a6453a;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    overscroll-behavior-y:none;
    padding-bottom:78px;
  }
  .num{font-family:'Oswald',system-ui,sans-serif;font-weight:600;letter-spacing:0.02em;}
  header.top{
    padding:22px 20px 14px;
    position:sticky;top:0;
    background:linear-gradient(180deg,var(--bg) 70%,transparent);
    z-index:5;
  }
  header.top h1{
    font-family:'Oswald',system-ui,sans-serif;
    font-size:22px;font-weight:700;letter-spacing:0.06em;
    text-transform:uppercase;margin:0;
    display:flex;align-items:center;gap:10px;
  }
  header.top h1 .plate{
    width:14px;height:14px;border-radius:50%;
    border:3px solid var(--accent);
    display:inline-block;
  }
  header.top p{margin:4px 0 0;color:var(--text-dim);font-size:13px;}
  main{padding:0 16px;max-width:640px;margin:0 auto;}
  .view{display:none;animation:fade .25s ease;}
  .view.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  nav.tabs{
    position:fixed;bottom:0;left:0;right:0;
    display:flex;background:var(--surface);
    border-top:1px solid var(--border);
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    z-index:10;
  }
  nav.tabs button{
    flex:1;background:none;border:none;color:var(--text-dim);
    font-family:'IBM Plex Sans',sans-serif;font-size:11px;font-weight:500;
    padding:8px 4px;border-radius:10px;display:flex;flex-direction:column;
    align-items:center;gap:4px;cursor:pointer;
    text-transform:uppercase;letter-spacing:0.04em;
  }
  nav.tabs button.active{color:var(--accent);background:var(--surface-2);}
  nav.tabs svg{width:20px;height:20px;}

  /* Cards */
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;margin-bottom:12px;
  }
  .card h3{margin:0 0 4px;font-size:16px;font-weight:600;}
  .muted{color:var(--text-dim);font-size:13px;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .chip{
    display:inline-block;font-size:11px;text-transform:uppercase;
    letter-spacing:0.05em;color:var(--gold);border:1px solid var(--gold);
    border-radius:20px;padding:2px 9px;font-weight:500;
  }

  button.primary{
    background:var(--accent);color:#fff;border:none;
    border-radius:10px;padding:12px 18px;font-size:14px;font-weight:600;
    cursor:pointer;font-family:'IBM Plex Sans',sans-serif;
  }
  button.primary:active{background:var(--accent-dim);}
  button.ghost{
    background:none;border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:10px 16px;font-size:13px;cursor:pointer;
    font-family:'IBM Plex Sans',sans-serif;
  }
  button.icon-btn{
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    border-radius:10px;width:38px;height:38px;display:flex;align-items:center;
    justify-content:center;cursor:pointer;
  }
  .fab-row{position:sticky;bottom:90px;display:flex;justify-content:flex-end;padding-top:6px;z-index:4;}

  input,select{
    width:100%;background:var(--surface-2);border:1px solid var(--border);
    color:var(--text);border-radius:10px;padding:11px 12px;font-size:14px;
    font-family:'IBM Plex Sans',sans-serif;margin-bottom:10px;
  }
  label.field-label{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.04em;display:block;margin-bottom:6px;}

  .group-filter{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none;}
  .group-filter::-webkit-scrollbar{display:none;}
  .group-filter button{
    flex-shrink:0;background:var(--surface);border:1px solid var(--border);
    color:var(--text-dim);border-radius:20px;padding:7px 14px;font-size:12px;
    cursor:pointer;font-family:'IBM Plex Sans',sans-serif;text-transform:capitalize;
  }
  .group-filter button.active{background:var(--accent);color:#fff;border-color:var(--accent);}

  .ex-item{display:flex;gap:12px;align-items:center;}
  .ex-thumb{
    width:52px;height:52px;border-radius:10px;background:var(--surface-2);
    border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
    flex-shrink:0;overflow:hidden;color:var(--text-dim);font-size:10px;text-align:center;
  }
  .ex-thumb img{width:100%;height:100%;object-fit:cover;}

  /* Modal */
  .overlay{
    position:fixed;inset:0;background:rgba(10,9,7,0.72);
    display:none;align-items:flex-end;z-index:20;
  }
  .overlay.active{display:flex;}
  .sheet{
    background:var(--surface);width:100%;max-width:640px;margin:0 auto;
    border-radius:20px 20px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));
    max-height:85vh;overflow-y:auto;
  }
  .sheet h2{margin:0 0 16px;font-family:'Oswald',sans-serif;font-size:18px;text-transform:uppercase;letter-spacing:0.04em;}
  .sheet-actions{display:flex;gap:10px;margin-top:6px;}
  .sheet-actions button{flex:1;}

  /* Séance en cours */
  .timer-hero{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px 18px;margin-bottom:16px;
  }
  .timer-hero .duree{font-size:13px;color:var(--text-dim);}
  .timer-hero .duree .num{font-size:20px;color:var(--text);display:block;}
  .plate-ring{position:relative;width:88px;height:88px;flex-shrink:0;}
  .plate-ring svg{transform:rotate(-90deg);}
  .plate-ring .bg{stroke:var(--surface-2);}
  .plate-ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .3s linear;}
  .plate-ring .center{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;
  }
  .plate-ring .center .num{font-size:20px;line-height:1;}
  .plate-ring .center .lbl{font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.05em;margin-top:2px;}

  .ex-block{margin-bottom:18px;}
  .ex-block-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .ex-block-head h4{margin:0;font-size:15px;font-weight:600;}
  table.series{width:100%;border-collapse:collapse;}
  table.series th{
    font-size:10px;text-transform:uppercase;color:var(--text-dim);
    text-align:left;padding:0 6px 6px;font-weight:500;letter-spacing:0.04em;
  }
  table.series td{padding:4px 6px;}
  table.series tr.serie-row{background:var(--surface);}
  table.series tr.serie-row td:first-child{border-radius:10px 0 0 10px;}
  table.series tr.serie-row td:last-child{border-radius:0 10px 10px 0;}
  table.series input{margin:0;padding:9px 8px;font-size:14px;width:64px;text-align:center;}
  .serie-num{color:var(--text-dim);font-size:13px;width:22px;text-align:center;}
  .check-btn{
    width:38px;height:38px;border-radius:10px;border:1px solid var(--border);
    background:var(--surface-2);color:var(--text-dim);font-size:16px;cursor:pointer;
  }
  .check-btn.done{background:var(--sage);border-color:var(--sage);color:#0f1a15;}
  tr.serie-row.done{opacity:0.75;}

  .empty-state{text-align:center;padding:40px 20px;color:var(--text-dim);}
  .empty-state .plate-lg{
    width:46px;height:46px;border:4px solid var(--border);border-radius:50%;
    margin:0 auto 14px;
  }
  .settings-link{
    display:block;text-align:center;color:var(--text-dim);font-size:12px;
    margin-top:20px;text-decoration:underline;background:none;border:none;cursor:pointer;
    width:100%;font-family:'IBM Plex Sans',sans-serif;
  }
  .sync-status{font-size:11px;color:var(--text-dim);text-align:center;margin-top:8px;}

  /* Evolution */
  .periode-filter{display:flex;gap:8px;margin-bottom:16px;}
  .periode-filter button{
    flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text-dim);
    border-radius:10px;padding:8px 6px;font-size:12px;cursor:pointer;
    font-family:'IBM Plex Sans',sans-serif;
  }
  .periode-filter button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .chart-title{font-size:13px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-dim);margin:0 0 10px;font-weight:500;}
  .hbar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .hbar-label{width:78px;flex-shrink:0;font-size:12px;color:var(--text-dim);text-transform:capitalize;}
  .hbar-track{flex:1;background:var(--surface-2);border-radius:6px;height:16px;overflow:hidden;}
  .hbar-fill{height:100%;background:var(--accent);border-radius:6px;transition:width .4s ease;}
  .hbar-fill.gold{background:var(--gold);}
  .hbar-value{width:64px;flex-shrink:0;text-align:right;font-size:12px;}
  .linechart-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px;}
</style>
</head>
<body>

<header class="top">
  <h1><span class="plate"></span>Fonte</h1>
  <p id="subhead">Ta bibliothèque, tes séances, ta salle.</p>
</header>

<main>

  <!-- VUE BIBLIOTHEQUE -->
  <section id="view-bibliotheque" class="view active">
    <div class="group-filter" id="groupFilter"></div>
    <div id="listeExercices"></div>
    <div class="fab-row"><button class="primary" onclick="ouvrirModalExercice()">+ Exercice</button></div>
  </section>

  <!-- VUE SEANCES -->
  <section id="view-seances" class="view">
    <div id="listeSeances"></div>
    <div class="fab-row"><button class="primary" onclick="ouvrirModalSeance()">+ Séance</button></div>
  </section>

  <!-- VUE EN COURS -->
  <section id="view-encours" class="view">
    <div id="encoursContent"></div>
  </section>

  <!-- VUE EVOLUTION -->
  <section id="view-evolution" class="view">
    <div id="evolutionContent"></div>
  </section>

  <button class="settings-link" onclick="ouvrirModalReglages()">Temps de repos par défaut</button>
  <button class="settings-link" onclick="ouvrirModalSync()">Synchronisation GitHub</button>
  <div class="sync-status" id="syncStatus"></div>
</main>

<nav class="tabs">
  <button data-view="bibliotheque" class="active" onclick="changerVue('bibliotheque')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="4" rx="1"/><rect x="3" y="10" width="18" height="4" rx="1"/><rect x="3" y="16" width="18" height="4" rx="1"/></svg>
    Bibliothèque
  </button>
  <button data-view="seances" onclick="changerVue('seances')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5a2 2 0 0 1 2-2h8.5L20 7.5V19a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M14 3v5h5"/></svg>
    Séances
  </button>
  <button data-view="encours" onclick="changerVue('encours')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
    En cours
  </button>
  <button data-view="evolution" onclick="changerVue('evolution')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
    Évolution
  </button>
</nav>

<!-- MODAL EXERCICE -->
<div class="overlay" id="modalExercice">
  <div class="sheet">
    <h2>Nouvel exercice</h2>
    <label class="field-label">Nom</label>
    <input type="text" id="exNom" placeholder="Ex : Développé incliné">
    <label class="field-label">Groupe musculaire</label>
    <select id="exGroupe">
      <option value="pecs">Pecs</option>
      <option value="dos">Dos</option>
      <option value="jambes">Jambes</option>
      <option value="epaules">Épaules</option>
      <option value="bras">Bras</option>
      <option value="abdos">Abdos</option>
    </select>
    <label class="field-label">Photo (optionnel)</label>
    <input type="file" id="exPhoto" accept="image/*">
    <div class="sheet-actions">
      <button class="ghost" onclick="fermerModal('modalExercice')">Annuler</button>
      <button class="primary" onclick="creerExercice()">Créer</button>
    </div>
  </div>
</div>

<!-- MODAL SEANCE -->
<div class="overlay" id="modalSeance">
  <div class="sheet">
    <h2>Nouvelle séance</h2>
    <label class="field-label">Nom de la séance</label>
    <input type="text" id="seNom" placeholder="Ex : Push">
    <label class="field-label">Exercices inclus</label>
    <div id="seExosCheck" style="max-height:280px;overflow-y:auto;margin-bottom:6px;"></div>
    <div class="sheet-actions">
      <button class="ghost" onclick="fermerModal('modalSeance')">Annuler</button>
      <button class="primary" onclick="creerSeance()">Créer</button>
    </div>
  </div>
</div>

<!-- MODAL REGLAGES -->
<div class="overlay" id="modalReglages">
  <div class="sheet">
    <h2>Temps de repos</h2>
    <label class="field-label">Durée par défaut (secondes)</label>
    <input type="number" id="reglageRepos" inputmode="numeric" min="10" step="5">
    <p class="muted">Ce chrono se lance dès qu'une série est cochée, et un bip sonne à la fin.</p>
    <div class="sheet-actions">
      <button class="ghost" onclick="fermerModal('modalReglages')">Annuler</button>
      <button class="primary" onclick="sauverReglages()">Enregistrer</button>
    </div>
  </div>
</div>

<!-- MODAL SYNC -->
<div class="overlay" id="modalSync">
  <div class="sheet">
    <h2>Synchronisation GitHub</h2>
    <label class="field-label">Compte / organisation</label>
    <input type="text" id="syncOwner" placeholder="ton-compte-github">
    <label class="field-label">Dépôt</label>
    <input type="text" id="syncRepo" placeholder="fonte-data">
    <label class="field-label">Fichier</label>
    <input type="text" id="syncPath" placeholder="data.json" value="data.json">
    <label class="field-label">Token d'accès personnel</label>
    <input type="password" id="syncToken" placeholder="ghp_...">
    <div class="sheet-actions">
      <button class="ghost" onclick="fermerModal('modalSync')">Fermer</button>
      <button class="primary" onclick="sauverConfigSync()">Enregistrer</button>
    </div>
    <div class="sheet-actions" style="margin-top:10px;">
      <button class="ghost" onclick="pousserVersGitHub()">Envoyer ↑</button>
      <button class="ghost" onclick="tirerDepuisGitHub()">Récupérer ↓</button>
    </div>
  </div>
</div>

<script>
/* ---------- Données de base ---------- */
const GROUPES = ['pecs','dos','jambes','epaules','bras','abdos'];
const GROUPES_LABEL = {pecs:'Pecs',dos:'Dos',jambes:'Jambes',epaules:'Épaules',bras:'Bras',abdos:'Abdos'};

const EXERCICES_BASE = [
  {id:'ex01',nom:'Développé couché',groupe:'pecs'},
  {id:'ex02',nom:'Pompes',groupe:'pecs'},
  {id:'ex03',nom:'Écarté couché',groupe:'pecs'},
  {id:'ex04',nom:'Tractions',groupe:'dos'},
  {id:'ex05',nom:'Rowing barre',groupe:'dos'},
  {id:'ex06',nom:'Tirage vertical',groupe:'dos'},
  {id:'ex07',nom:'Squat',groupe:'jambes'},
  {id:'ex08',nom:'Presse à cuisses',groupe:'jambes'},
  {id:'ex09',nom:'Fentes',groupe:'jambes'},
  {id:'ex10',nom:'Développé militaire',groupe:'epaules'},
  {id:'ex11',nom:'Élévations latérales',groupe:'epaules'},
  {id:'ex12',nom:'Oiseau',groupe:'epaules'},
  {id:'ex13',nom:'Curl biceps',groupe:'bras'},
  {id:'ex14',nom:'Extension triceps',groupe:'bras'},
  {id:'ex15',nom:'Dips',groupe:'bras'},
  {id:'ex16',nom:'Crunch',groupe:'abdos'},
  {id:'ex17',nom:'Planche',groupe:'abdos'},
  {id:'ex18',nom:'Relevé de jambes',groupe:'abdos'}
];

/* ---------- État ---------- */
const STORAGE_KEY = 'fonteAppData';
const SYNC_KEY = 'fonteSyncConfig';

function chargerEtat(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw){
    try{ return JSON.parse(raw); }catch(e){}
  }
  return {
    exercices: EXERCICES_BASE.map(e=>({...e,image:null,source:'predefinit'})),
    seances: [],
    historique: [],
    seanceActive: null
  };
}
let etat = chargerEtat();
let filtreGroupe = 'tous';

function sauver(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(etat));
}

/* ---------- Navigation ---------- */
function changerVue(nom){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+nom).classList.add('active');
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active', b.dataset.view===nom));
  if(nom==='bibliotheque') renderBibliotheque();
  if(nom==='seances') renderSeances();
  if(nom==='encours') renderEnCours();
  if(nom==='evolution') renderEvolution();
}

/* ---------- Vue Bibliothèque ---------- */
function renderGroupFilter(){
  const c = document.getElementById('groupFilter');
  const groupes = ['tous',...GROUPES];
  c.innerHTML = groupes.map(g=>`<button class="${filtreGroupe===g?'active':''}" onclick="setFiltre('${g}')">${g==='tous'?'Tous':GROUPES_LABEL[g]}</button>`).join('');
}
function setFiltre(g){ filtreGroupe = g; renderBibliotheque(); }

function renderBibliotheque(){
  renderGroupFilter();
  const c = document.getElementById('listeExercices');
  let liste = etat.exercices;
  if(filtreGroupe!=='tous') liste = liste.filter(e=>e.groupe===filtreGroupe);
  if(liste.length===0){
    c.innerHTML = `<div class="empty-state"><div class="plate-lg"></div>Aucun exercice dans ce groupe.</div>`;
    return;
  }
  c.innerHTML = liste.map(e=>`
    <div class="card ex-item">
      <div class="ex-thumb">${e.image ? `<img src="${e.image}">` : 'Photo'}</div>
      <div style="flex:1;">
        <h3>${e.nom}</h3>
        <span class="chip">${GROUPES_LABEL[e.groupe]}</span>
      </div>
      <label class="icon-btn" title="Ajouter une photo" style="cursor:pointer;">
        📷
        <input type="file" accept="image/*" style="display:none;" onchange="ajouterPhoto('${e.id}', this)">
      </label>
    </div>
  `).join('');
}

function ajouterPhoto(exId, input){
  const fichier = input.files[0];
  if(!fichier) return;
  const lecteur = new FileReader();
  lecteur.onload = function(e){
    const ex = etat.exercices.find(x=>x.id===exId);
    if(ex){ ex.image = e.target.result; sauver(); renderBibliotheque(); }
  };
  lecteur.readAsDataURL(fichier);
}

function ouvrirModalExercice(){
  document.getElementById('exNom').value='';
  document.getElementById('exPhoto').value='';
  ouvrirModal('modalExercice');
}
function creerExercice(){
  const nom = document.getElementById('exNom').value.trim();
  const groupe = document.getElementById('exGroupe').value;
  const fichier = document.getElementById('exPhoto').files[0];
  if(!nom){ alert('Donne un nom à l\'exercice.'); return; }
  const nouvel = {id:'ex_'+Date.now(), nom, groupe, image:null, source:'perso'};
  const finaliser = ()=>{
    etat.exercices.push(nouvel);
    sauver();
    fermerModal('modalExercice');
    renderBibliotheque();
  };
  if(fichier){
    const lecteur = new FileReader();
    lecteur.onload = e=>{ nouvel.image = e.target.result; finaliser(); };
    lecteur.readAsDataURL(fichier);
  } else finaliser();
}

/* ---------- Vue Séances ---------- */
function renderSeances(){
  const c = document.getElementById('listeSeances');
  if(etat.seances.length===0){
    c.innerHTML = `<div class="empty-state"><div class="plate-lg"></div>Crée ta première séance à partir de ta bibliothèque.</div>`;
    return;
  }
  c.innerHTML = etat.seances.map(s=>`
    <div class="card">
      <div class="row">
        <div>
          <h3>${s.nom}</h3>
          <p class="muted">${s.exercices.length} exercice${s.exercices.length>1?'s':''}</p>
        </div>
        <button class="primary" onclick="demarrerSeance('${s.id}')">Démarrer</button>
      </div>
    </div>
  `).join('');
}

function ouvrirModalSeance(){
  document.getElementById('seNom').value='';
  const c = document.getElementById('seExosCheck');
  c.innerHTML = etat.exercices.map(e=>`
    <label style="display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--border);">
      <input type="checkbox" value="${e.id}" style="width:auto;margin:0;">
      <span>${e.nom} <span class="muted">· ${GROUPES_LABEL[e.groupe]}</span></span>
    </label>
  `).join('');
  ouvrirModal('modalSeance');
}
function creerSeance(){
  const nom = document.getElementById('seNom').value.trim();
  const cases = document.querySelectorAll('#seExosCheck input[type=checkbox]:checked');
  if(!nom){ alert('Donne un nom à la séance.'); return; }
  if(cases.length===0){ alert('Sélectionne au moins un exercice.'); return; }
  const exercices = Array.from(cases).map(c=>({exerciceId:c.value, seriesPrevues:4, repsCibles:10}));
  etat.seances.push({id:'se_'+Date.now(), nom, exercices});
  sauver();
  fermerModal('modalSeance');
  renderSeances();
}

/* ---------- Séance en cours ---------- */
let chronoSeanceInterval = null;
let chronoRepoInterval = null;
let repoRestantSec = 0;
let repoTotalSec = 90;

function demarrerSeance(seanceId){
  const modele = etat.seances.find(s=>s.id===seanceId);
  if(!modele) return;
  etat.seanceActive = {
    seanceId,
    nom: modele.nom,
    debutTs: Date.now(),
    series: modele.exercices.flatMap(ex=>{
      const arr = [];
      for(let i=1;i<=ex.seriesPrevues;i++){
        arr.push({exerciceId:ex.exerciceId, numero:i, poids:'', reps: ex.repsCibles, fait:false});
      }
      return arr;
    })
  };
  sauver();
  changerVue('encours');
  activerWakeLock();
}

function terminerSeance(){
  if(!etat.seanceActive) return;
  if(!confirm('Terminer et enregistrer cette séance ?')) return;
  const s = etat.seanceActive;
  etat.historique.push({
    id:'h_'+Date.now(),
    seanceId: s.seanceId,
    nom: s.nom,
    date: new Date(s.debutTs).toISOString().slice(0,10),
    debut: new Date(s.debutTs).toTimeString().slice(0,5),
    fin: new Date().toTimeString().slice(0,5),
    series: s.series
  });
  etat.seanceActive = null;
  sauver();
  relacherWakeLock();
  arreterChronos();
  renderEnCours();
}

function renderEnCours(){
  const c = document.getElementById('encoursContent');
  if(!etat.seanceActive){
    // proposer de choisir une séance si aucune n'est active
    if(etat.seances.length===0){
      c.innerHTML = `<div class="empty-state"><div class="plate-lg"></div>Aucune séance active. Crée d'abord une séance dans l'onglet Séances.</div>`;
      return;
    }
    c.innerHTML = `<div class="empty-state"><div class="plate-lg"></div>Aucune séance en cours.<br><br>Lance une séance depuis l'onglet Séances.</div>`;
    return;
  }
  const s = etat.seanceActive;
  const parExercice = {};
  s.series.forEach(sr=>{
    if(!parExercice[sr.exerciceId]) parExercice[sr.exerciceId]=[];
    parExercice[sr.exerciceId].push(sr);
  });

  let html = `
    <div class="timer-hero">
      <div class="duree">
        Durée séance
        <span class="num" id="dureeSeance">00:00</span>
      </div>
      <div class="plate-ring">
        <svg width="88" height="88">
          <circle class="bg" cx="44" cy="44" r="38" fill="none" stroke-width="7"/>
          <circle class="fg" id="ringRepos" cx="44" cy="44" r="38" fill="none" stroke-width="7"
            stroke-dasharray="238.6" stroke-dashoffset="238.6"/>
        </svg>
        <div class="center">
          <span class="num" id="txtRepos">--</span>
          <span class="lbl">repos</span>
        </div>
      </div>
    </div>
  `;

  Object.keys(parExercice).forEach(exId=>{
    const ex = etat.exercices.find(e=>e.id===exId) || {nom:'Exercice'};
    html += `<div class="ex-block">
      <div class="ex-block-head"><h4>${ex.nom}</h4></div>
      <table class="series">
        <tr><th></th><th>Poids (kg)</th><th>Reps</th><th></th></tr>
        ${parExercice[exId].map(sr=>`
          <tr class="serie-row ${sr.fait?'done':''}">
            <td class="serie-num">${sr.numero}</td>
            <td><input type="number" inputmode="decimal" value="${sr.poids}" onchange="majSerie('${exId}',${sr.numero},'poids',this.value)"></td>
            <td><input type="number" inputmode="numeric" value="${sr.reps}" onchange="majSerie('${exId}',${sr.numero},'reps',this.value)"></td>
            <td><button class="check-btn ${sr.fait?'done':''}" onclick="toggleSerie('${exId}',${sr.numero})">${sr.fait?'✓':''}</button></td>
          </tr>
        `).join('')}
      </table>
    </div>`;
  });

  html += `<button class="primary" style="width:100%;margin-top:10px;" onclick="terminerSeance()">Terminer la séance</button>`;
  c.innerHTML = html;
  demarrerChronoSeance();
}

function majSerie(exId, numero, champ, valeur){
  const sr = etat.seanceActive.series.find(x=>x.exerciceId===exId && x.numero===numero);
  if(sr){ sr[champ] = valeur; sauver(); }
}

function toggleSerie(exId, numero){
  const sr = etat.seanceActive.series.find(x=>x.exerciceId===exId && x.numero===numero);
  if(!sr) return;
  sr.fait = !sr.fait;
  sauver();
  renderEnCours();
  if(sr.fait){
    initAudio();
    demarrerChronoRepos(chargerReglages().repoDefaut);
  }
}

function demarrerChronoSeance(){
  clearInterval(chronoSeanceInterval);
  chronoSeanceInterval = setInterval(()=>{
    if(!etat.seanceActive) return;
    const sec = Math.floor((Date.now()-etat.seanceActive.debutTs)/1000);
    const m = String(Math.floor(sec/60)).padStart(2,'0');
    const s = String(sec%60).padStart(2,'0');
    const el = document.getElementById('dureeSeance');
    if(el) el.textContent = `${m}:${s}`;
  },1000);
}

function demarrerChronoRepos(sec){
  repoTotalSec = sec;
  repoRestantSec = sec;
  clearInterval(chronoRepoInterval);
  majAnneauRepos();
  chronoRepoInterval = setInterval(()=>{
    repoRestantSec--;
    if(repoRestantSec<=0){
      clearInterval(chronoRepoInterval);
      repoRestantSec=0;
      majAnneauRepos();
      jouerBip();
      return;
    }
    majAnneauRepos();
  },1000);
}

function majAnneauRepos(){
  const txt = document.getElementById('txtRepos');
  const ring = document.getElementById('ringRepos');
  if(!txt || !ring) return;
  txt.textContent = repoRestantSec>0 ? repoRestantSec : '--';
  const circonference = 238.6;
  const ratio = repoTotalSec>0 ? repoRestantSec/repoTotalSec : 0;
  ring.style.strokeDashoffset = circonference * (1-ratio);
}

function arreterChronos(){
  clearInterval(chronoSeanceInterval);
  clearInterval(chronoRepoInterval);
}

/* ---------- Réglages ---------- */
const REGLAGES_KEY = 'fonteReglages';
function chargerReglages(){
  const raw = localStorage.getItem(REGLAGES_KEY);
  return raw ? JSON.parse(raw) : {repoDefaut:90};
}
function ouvrirModalReglages(){
  document.getElementById('reglageRepos').value = chargerReglages().repoDefaut;
  ouvrirModal('modalReglages');
}
function sauverReglages(){
  const val = parseInt(document.getElementById('reglageRepos').value, 10);
  const repoDefaut = (!isNaN(val) && val>0) ? val : 90;
  localStorage.setItem(REGLAGES_KEY, JSON.stringify({repoDefaut}));
  fermerModal('modalReglages');
}

/* ---------- Son ---------- */
let audioCtx = null;
function initAudio(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    else if(audioCtx.state==='suspended') audioCtx.resume();
  }catch(e){ console.log('Audio indisponible :', e); }
}
function jouerBip(){
  if(!audioCtx) return;
  for(let i=0;i<2;i++){
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 880;
    gain.gain.value = 0.25;
    const debut = audioCtx.currentTime + i*0.35;
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(debut);
    osc.stop(debut+0.25);
  }
}

/* ---------- Évolution ---------- */
let periodeEvolution = 30; // jours, ou 'tout'

function tonnageDeSerie(sr){
  const poids = parseFloat(sr.poids) || 0;
  const reps = parseInt(sr.reps) || 0;
  return poids * reps;
}

function seancesDansPeriode(jours){
  if(jours==='tout') return etat.historique.slice();
  const seuil = Date.now() - jours*24*60*60*1000;
  return etat.historique.filter(h=> new Date(h.date).getTime() >= seuil);
}

function tonnageParSeance(limite=10){
  const liste = etat.historique.slice(-limite);
  return liste.map(h=>({
    label: h.nom + ' · ' + h.date.slice(5),
    valeur: h.series.filter(s=>s.fait).reduce((acc,s)=>acc+tonnageDeSerie(s),0)
  }));
}

function numeroSemaine(dateStr){
  const d = new Date(dateStr);
  const debutAnnee = new Date(d.getFullYear(),0,1);
  const jours = Math.floor((d - debutAnnee)/(24*60*60*1000));
  const semaine = Math.ceil((jours + debutAnnee.getDay()+1)/7);
  return `S${semaine}`;
}

function tonnageParSemaine(nbSemaines=8){
  const parSemaine = {};
  etat.historique.forEach(h=>{
    const cle = numeroSemaine(h.date);
    const tonnage = h.series.filter(s=>s.fait).reduce((acc,s)=>acc+tonnageDeSerie(s),0);
    parSemaine[cle] = (parSemaine[cle]||0) + tonnage;
  });
  const cles = Object.keys(parSemaine);
  return cles.slice(-nbSemaines).map(cle=>({label:cle, valeur:parSemaine[cle]}));
}

function statsParGroupe(jours){
  const seances = seancesDansPeriode(jours);
  const tonnage = {}; const series = {};
  GROUPES.forEach(g=>{tonnage[g]=0; series[g]=0;});
  seances.forEach(h=>{
    h.series.forEach(sr=>{
      if(!sr.fait) return;
      const ex = etat.exercices.find(e=>e.id===sr.exerciceId);
      const groupe = ex ? ex.groupe : null;
      if(!groupe || !(groupe in tonnage)) return;
      tonnage[groupe] += tonnageDeSerie(sr);
      series[groupe] += 1;
    });
  });
  return {tonnage, series};
}

function renderBarresHorizontales(data, {suffixe='', classe=''}={}){
  const max = Math.max(...data.map(d=>d.valeur), 1);
  return data.map(d=>`
    <div class="hbar-row">
      <div class="hbar-label">${d.label}</div>
      <div class="hbar-track"><div class="hbar-fill ${classe}" style="width:${(d.valeur/max*100).toFixed(1)}%"></div></div>
      <div class="hbar-value num">${Math.round(d.valeur)}${suffixe}</div>
    </div>
  `).join('');
}

function renderCourbe(data){
  if(data.length===0) return '<p class="muted">Pas encore de données.</p>';
  const w = 300, h = 90, pad = 8;
  const max = Math.max(...data.map(d=>d.valeur), 1);
  const step = data.length>1 ? (w-2*pad)/(data.length-1) : 0;
  const points = data.map((d,i)=>{
    const x = pad + i*step;
    const y = h - pad - (d.valeur/max)*(h-2*pad);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const labels = data.map((d,i)=>{
    const x = pad + i*step;
    return `<text x="${x.toFixed(1)}" y="${h-1}" font-size="7" fill="var(--text-dim)" text-anchor="middle">${d.label}</text>`;
  }).join('');
  return `
    <svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
      <polyline points="${points}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${data.map((d,i)=>{
        const x = pad + i*step;
        const y = h - pad - (d.valeur/max)*(h-2*pad);
        return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="var(--gold)"/>`;
      }).join('')}
    </svg>
    <div style="display:flex;justify-content:space-between;margin-top:4px;">
      ${data.map(d=>`<span style="font-size:9px;color:var(--text-dim);">${d.label}</span>`).join('')}
    </div>
  `;
}

function setPeriodeEvolution(j){ periodeEvolution = j; renderEvolution(); }

function renderEvolution(){
  const c = document.getElementById('evolutionContent');
  if(etat.historique.length===0){
    c.innerHTML = `<div class="empty-state"><div class="plate-lg"></div>Termine une première séance pour voir ton évolution ici.</div>`;
    return;
  }

  const parSeance = tonnageParSeance(10);
  const parSemaine = tonnageParSemaine(8);
  const {tonnage, series} = statsParGroupe(periodeEvolution);
  const tonnageData = GROUPES.map(g=>({label:GROUPES_LABEL[g], valeur:tonnage[g]}));
  const seriesData = GROUPES.map(g=>({label:GROUPES_LABEL[g], valeur:series[g]}));

  c.innerHTML = `
    <div class="linechart-wrap">
      <p class="chart-title">Tonnage par semaine (kg)</p>
      ${renderCourbe(parSemaine)}
    </div>

    <div class="card">
      <p class="chart-title">Tonnage par séance (kg)</p>
      ${renderBarresHorizontales(parSeance, {classe:'gold'})}
    </div>

    <p class="chart-title" style="margin-top:4px;">Sur la période :</p>
    <div class="periode-filter">
      <button class="${periodeEvolution===7?'active':''}" onclick="setPeriodeEvolution(7)">7 jours</button>
      <button class="${periodeEvolution===30?'active':''}" onclick="setPeriodeEvolution(30)">30 jours</button>
      <button class="${periodeEvolution==='tout'?'active':''}" onclick="setPeriodeEvolution('tout')">Tout</button>
    </div>

    <div class="card">
      <p class="chart-title">Tonnage par groupe musculaire (kg)</p>
      ${renderBarresHorizontales(tonnageData)}
    </div>

    <div class="card">
      <p class="chart-title">Nombre de séries par groupe musculaire</p>
      ${renderBarresHorizontales(seriesData)}
    </div>
  `;
}

/* ---------- Wake Lock ---------- */
let wakeLock = null;
async function activerWakeLock(){
  try{
    if('wakeLock' in navigator){
      wakeLock = await navigator.wakeLock.request('screen');
    }
  }catch(err){
    console.log('Wake Lock indisponible :', err);
  }
}
function relacherWakeLock(){
  if(wakeLock){ wakeLock.release(); wakeLock=null; }
}
document.addEventListener('visibilitychange', ()=>{
  if(wakeLock!==null && document.visibilityState==='visible' && etat.seanceActive){
    activerWakeLock();
  }
});

/* ---------- Modales ---------- */
function ouvrirModal(id){ document.getElementById(id).classList.add('active'); }
function fermerModal(id){ document.getElementById(id).classList.remove('active'); }

/* ---------- Sync GitHub ---------- */
function chargerConfigSync(){
  const raw = localStorage.getItem(SYNC_KEY);
  return raw ? JSON.parse(raw) : {owner:'',repo:'',path:'data.json',token:''};
}
function ouvrirModalSync(){
  const cfg = chargerConfigSync();
  document.getElementById('syncOwner').value = cfg.owner;
  document.getElementById('syncRepo').value = cfg.repo;
  document.getElementById('syncPath').value = cfg.path;
  document.getElementById('syncToken').value = cfg.token;
  ouvrirModal('modalSync');
}
function sauverConfigSync(){
  const cfg = {
    owner: document.getElementById('syncOwner').value.trim(),
    repo: document.getElementById('syncRepo').value.trim(),
    path: document.getElementById('syncPath').value.trim() || 'data.json',
    token: document.getElementById('syncToken').value.trim()
  };
  localStorage.setItem(SYNC_KEY, JSON.stringify(cfg));
  document.getElementById('syncStatus').textContent = 'Configuration enregistrée.';
  fermerModal('modalSync');
}

async function pousserVersGitHub(){
  const cfg = chargerConfigSync();
  if(!cfg.owner || !cfg.repo || !cfg.token){ alert('Configure d\'abord owner, repo et token.'); return; }
  const statusEl = document.getElementById('syncStatus');
  statusEl.textContent = 'Envoi en cours...';
  try{
    const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}`;
    let sha = null;
    const existant = await fetch(url, {headers:{Authorization:`token ${cfg.token}`}});
    if(existant.ok){ const j = await existant.json(); sha = j.sha; }
    const contenu = btoa(unescape(encodeURIComponent(JSON.stringify(etat, null, 2))));
    const resp = await fetch(url, {
      method:'PUT',
      headers:{Authorization:`token ${cfg.token}`, 'Content-Type':'application/json'},
      body: JSON.stringify({message:'Sync Fonte '+new Date().toISOString(), content:contenu, sha})
    });
    if(!resp.ok) throw new Error('Échec envoi ('+resp.status+')');
    statusEl.textContent = 'Envoyé sur GitHub avec succès.';
  }catch(e){
    statusEl.textContent = 'Erreur : '+e.message;
  }
}

async function tirerDepuisGitHub(){
  const cfg = chargerConfigSync();
  if(!cfg.owner || !cfg.repo || !cfg.token){ alert('Configure d\'abord owner, repo et token.'); return; }
  const statusEl = document.getElementById('syncStatus');
  statusEl.textContent = 'Récupération en cours...';
  try{
    const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}`;
    const resp = await fetch(url, {headers:{Authorization:`token ${cfg.token}`}});
    if(!resp.ok) throw new Error('Échec récupération ('+resp.status+')');
    const j = await resp.json();
    const contenu = decodeURIComponent(escape(atob(j.content)));
    etat = JSON.parse(contenu);
    sauver();
    statusEl.textContent = 'Données récupérées depuis GitHub.';
    renderBibliotheque(); renderSeances(); renderEnCours();
  }catch(e){
    statusEl.textContent = 'Erreur : '+e.message;
  }
}

/* ---------- Démarrage ---------- */
renderBibliotheque();
